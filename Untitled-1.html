<html>

<head>
  <title>我的第一个博客
  </title>
  <style>
    body {
      background-color: azure;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      text-align: center;
    }

    h1 {
      color: darkorange;
      font-size: 48px;
    }

    p {
      color: aquamarine;
      font-size: 20px;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      border-radius: 12px;
      max-width: 800px;
      margin: 0 auto 20px auto;
      background-color: lightyellow;
    }

    .blog-title {
      font-size: 24px;
      font-weight: bold;
      color: darkorange;
    }

    .nav-link {
      margin-left: 20px;
      color: #333;
      text-decoration: none;
    }

    #article-list {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px 30px;
      margin-bottom: 20px;
      text-align: left;

    }

    .card-title {
      font-size: 24px;
      font-weight: bold;
      color: darkorange;
      margin: 0 0 5px 0;
    }

    .card-date {
      font-size: 14px;
      color: #999;
      margin: 0 0 10px 0;
    }

    .card-summary {
      font-size: 16px;
      color: #333;
      margin: 0;
    }

    .modal {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      width: 80%;
      max-height: 80%;
      overflow-y: auto;
      text-align: left;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 28px;
      cursor: pointer;
      color: sienna;
    }

    .close-btn:hover {
      color: darkorange;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="blog-title">欢迎来到我的博客❤️💕</div>
    <div>
      <a href="#" class="nav-link">首页</a>
      <a href="#" class="nav-link">文章</a>
      <a href="#" class="nav-link">关于</a>
    </div>

  </div>
  <h1>
    <img src="images/tafei cat.gif" alt="动态表情" style="vertical-align: middle; margin-right: 10px;height: 50px;">
    文章列表
  </h1>
  <div id="article-list"></div>
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="close-btn" class="close-btn">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>
  </div>
  </div>
  <script>
    const posts = [
      {
        title: '第一篇博客:我入坑了',
        date: '2026-9.9',
        SUMMARY: '今天我终于入坑了，开始写博客了，感觉很开心，希望以后能坚持下去。',
        content: '今天我终于入坑了，开始写博客了，感觉很开心，希望以后能坚持下去。今天和朋友也在讨论关于考研还是就业这个问题，我两个持不同的意见，但是我想其实答案没有优劣之分，世界不是非黑即白的，每个人都有自己的选择，只要遵从自己的内心就好了。接下来的时间我会好好的把英语和数学学好，特别是多注意一下英语口语这方面的。除此之外就是好好学技术，要坚持嘞！没关系的好好学每天都给自己定小目标，但也要 hold your horses,ok今天就先写到这里。爱你老己，会变优秀的。'
      }
      , {
        title: '要坚持哦',
        date: '2026-9.14',
        SUMMARY: '最近有点懒惰，没怎么写博客，希望以后能坚持下去。',
        content: '一定要坚持下去哦,今天和朋友也在讨论关于考研还是就业这个问题,我两个持不同的意见,但是我想其实答案没有优劣之分,世界不是非黑即白的,每个人都有自己的选择,只要遵从自己的内心就好了.接下来的时间我会好好的把英语和数学学好,特别是多注意一下英语口语这方面的.除此之外就是好好学技术,要坚持嘞!没关系的好好学每天都给自己定小目标,但也要 hold your horses,ok今天就先写到这里.爱你老己,会变优秀的.'

      }

    ]
    const articleList = document.getElementById('article-list');
    posts.forEach(post => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2 class="card-title">${post.title}</h2>
        <p class="card-date">${post.date}</p>
        <p class="card-summary">${post.SUMMARY}</p>
      `;
      card.onclick = function () {
        document.getElementById('modal-body').innerHTML = `
          <h2>${post.title}</h2>
          <div class="card-date">${post.date}</div>
          <p>${post.content}</p>
        `;
        document.getElementById('modal').style.display = 'flex';
      }
      articleList.appendChild(card);
    });
    document.getElementById('close-btn').onclick = function () {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>

</html>
